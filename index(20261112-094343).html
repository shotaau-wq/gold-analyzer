<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTM v21.9｜5分足候補</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0e121a;color:#eef2f8}main{max-width:560px;margin:auto;padding:22px}h1{font-size:24px;margin:6px 0}header p,small{color:#aab8cc}section,details{background:#171f2c;border:1px solid #303c50;border-radius:16px;padding:16px;margin:12px 0}h2{font-size:16px;margin:0 0 8px}.price{font-size:32px;font-weight:750;font-variant-numeric:tabular-nums}.buy{color:#82e4bd}.sell{color:#ffabae}p{line-height:1.55;margin:8px 0}label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}input:not([type=checkbox]){width:90px}input[type=password]{width:52%}input,button{font:inherit;padding:8px;border:1px solid #51617a;border-radius:8px}button,summary{cursor:pointer}button{background:#253653}summary{font-weight:700}
</style>
<main>
<header><small>XAU/USD · GTM v21.9</small><h1>5分足エントリー候補</h1><p id="status" role="status">APIキーを設定すると取得を開始します</p><button id="refresh">更新</button></header>
<div id="results" aria-live="polite"></div>
<details id="settings"><summary>⚙ GTM設定</summary>
<form id="form"><label>Twelve Data APIキー <input id="key" type="password" autocomplete="off" required></label><div id="fields"></div><button>保存して更新</button></form>
</details>
</main>
<script>
'use strict';
const defaults = {
 trend:[true,'順張り'], reverse:[false,'逆張り'], range:[true,'レンジ'],
 strict:[true,'厳選モード'], cooldown:[3,'サイン間隔（本）'],
 adaptive:[true,'相場適応'], block:[true,'急変動時の新規停止'], spike:[1.8,'急変動ATR倍率'],
 fast:[20,'短期EMA'], slow:[200,'長期EMA'], trendADX:[30,'順張りADX下限'],
 pullback:[8,'押し目確認期間'], near:[0.5,'EMA接近許容（ATR）'],
 reverseLen:[12,'逆張り参照期間'], reverseLow:[20,'逆張り買いRSI下限'], reverseHigh:[80,'逆張り売りRSI上限'],
 rangeLen:[20,'レンジ参照期間'], rangeADX:[23,'レンジADX上限'], edge:[0.4,'レンジ端許容（ATR）'],
 wick:[0.5,'レンジ反発ヒゲ／実体'], sr:[true,'レジサポを判定に使用'],
 room:[true,'順張り：近い壁を避ける'], rangeSR:[false,'レンジ：レジサポ接近必須'],
 left:[3,'ピボット左'], right:[3,'ピボット右'], srNear:[0.7,'レジサポ接近許容（ATR）'],
 roomR:[0.8,'順張り：次の壁まで最低R'], atr:[14,'ATR期間'], swing:[10,'SLスイング期間'],
 buffer:[0.2,'構造SL余裕（ATR）'], reward:[0.6,'最低TP1距離（R）'], maxRisk:[3,'最大SL距離（ATR）'],
 tp1:[1,'順張りTP1（R）'], tp2:[1.8,'順張りTP2（R）'], hold:[12,'最大保有本数']
};
const $ = id => document.getElementById(id);
const keyName = 'gold_v20_api_key', settingsName = 'gtm_v219_safari_settings';
const integers = new Set(['cooldown','fast','slow','pullback','reverseLen','rangeLen','left','right','atr','swing','hold']);
let cfg = Object.fromEntries(Object.entries(defaults).map(([k,[v]]) => [k,v]));
try { Object.assign(cfg, JSON.parse(localStorage.getItem(settingsName) || '{}')); $('key').value = localStorage.getItem(keyName) || ''; } catch {}
for (const [k,[v,label]] of Object.entries(defaults)) {
 const row = document.createElement('label'), input = document.createElement('input');
 input.id = k;
 if (typeof v === 'boolean') {
  input.type = 'checkbox';
  input.checked = cfg[k];
 } else {
  input.type = 'number';
  input.step = integers.has(k) ? '1' : 'any';
  input.min = ['cooldown','roomR','wick'].includes(k) ? '0' : integers.has(k) ? '1' : '0.01';
  input.max = integers.has(k) ? '500' : '100';
  input.value = cfg[k];
  input.required = true;
 }
 row.append(label,input);
 $('fields').append(row);
}
$('settings').open = !$('key').value;
const sum = xs => xs.reduce((a,b) => a+b,0);
const avg = xs => sum(xs)/xs.length;
const emaStep = (prev,x,n) => prev + (x-prev)*2/(n+1);
const smooth = (prev,x,n) => (prev*(n-1)+x)/n;
const num = x => x.toFixed(2);
const frame = 300000, tick = 0.01;
function measure(rows) {
 let fast = rows[0].c, slow = fast;
 const tr = [], gains = [], losses = [], up = [], down = [], dx = [];
 return rows.map((b,i) => {
  const p = rows[i-1];
  fast = emaStep(fast,b.c,cfg.fast);
  slow = emaStep(slow,b.c,cfg.slow);
  const d = p ? b.c-p.c : 0;
  const high = p ? b.h-p.h : 0, low = p ? p.l-b.l : 0;
  tr.push(p ? Math.max(b.h-b.l,b.h-p.c,p.c-b.l) : b.h-b.l);
  gains.push(Math.max(d,0)); losses.push(Math.max(-d,0));
  up.push(high > Math.max(low,0) ? high : 0);
  down.push(low > Math.max(high,0) ? low : 0);
  function w(series,n,start=0) {
   if (i < start+n-1) return NaN;
   return i === start+n-1 ? avg(series.slice(start,i+1)) : smooth(series[i-1],series[i],n);
  }
  const atr = w(tr,cfg.atr), gain = w(gains,14,1), loss = w(losses,14,1);
  const plus = w(up,14,1), minus = w(down,14,1);
  dx.push(plus+minus ? 100*Math.abs(plus-minus)/(plus+minus) : 0);
  const adx = w(dx,14,14);
  for (const [series,value] of [[tr,atr],[gains,gain],[losses,loss],[up,plus],[down,minus],[dx,adx]])
   if (Number.isFinite(value)) series[i]=value;
  return {...b,fast,slow,atr,adx,plus,minus,gain,loss,rsi:loss===0 ? 100 : gain===0 ? 0 : 100-100/(1+gain/loss)};
 });
}
function aggregate(rows,ms) {
 const groups = new Map();
 for (const b of rows) {
  const t = Math.floor(b.t/ms)*ms, g = groups.get(t);
  groups.set(t,g ? {...g,c:b.c,h:Math.max(g.h,b.h),l:Math.min(g.l,b.l)} : {...b,t});
 }
 return [...groups.values()];
}
function pivots(rows) {
 let high,low;
 for (let i=cfg.left;i+cfg.right<rows.length;i++) {
  const window = rows.slice(i-cfg.left,i+cfg.right+1), p = rows[i];
  if (window.every((b,j) => j<=cfg.left ? b.h<=p.h : b.h<p.h)) high=p.h;
  if (window.every((b,j) => j<=cfg.left ? b.l>=p.l : b.l>p.l)) low=p.l;
 }
 return [high,low].filter(Number.isFinite);
}
function context(history,t) {
 const p=history.at(-1), h15=aggregate(history,frame*3).filter(b=>b.t+frame*3<=t);
 const h60=aggregate(history,frame*12).filter(b=>b.t+frame*12<=t);
 const higher=h15.length?measure(h15).at(-1):{}, past=history.slice(-cfg.pullback);
 const span=(n,key,fn)=>fn(...history.slice(-n).map(b=>b[key]));
 return {p,higher,past,span,history,levels:[...pivots(h15),...pivots(h60)]};
}
function evaluate(ctx,b) {
 const {p,higher,past,span,history,levels}=ctx;
 const a=smooth(p.atr,Math.max(b.h-b.l,b.h-p.c,p.c-b.l),cfg.atr);
 const high=b.h-p.h,low=p.l-b.l, plus=smooth(p.plus,high>Math.max(low,0)?high:0,14);
 const minus=smooth(p.minus,low>Math.max(high,0)?low:0,14);
 const adx=smooth(p.adx,plus+minus?100*Math.abs(plus-minus)/(plus+minus):0,14);
 const delta=b.c-p.c, gain=smooth(p.gain,Math.max(delta,0),14),loss=smooth(p.loss,Math.max(-delta,0),14);
 const rsi=loss===0?100:100-100/(1+gain/loss);
 const fast=emaStep(p.fast,b.c,cfg.fast),slow=emaStep(p.slow,b.c,cfg.slow);
 const strong=adx>=30, required=cfg.trendADX-(cfg.adaptive&&strong?2:0);
 if (cfg.block && a>=cfg.spike*avg([...history.slice(-49).map(x=>x.atr),a])) return [];
 const lo=span(cfg.rangeLen,'l',Math.min),hi=span(cfg.rangeLen,'h',Math.max),mid=(lo+hi)/2;
 const body=Math.max(tick,Math.abs(b.c-b.o)), candidates=[];
 const walls=cfg.sr?[...levels,...pivots([...history.slice(-Math.max(100,cfg.left+cfg.right+1)),b])]:[];
 const support=Math.max(-Infinity,...walls.filter(x=>x<=b.c));
 const resistance=Math.min(Infinity,...walls.filter(x=>x>b.c));
 for(const method of ['trend','reverse','range']) for(const d of [1,-1]){
  if(!cfg[method] || d*(b.c-b.o)<=0) continue;
  const buy=d===1, extreme=buy?b.l:b.h, wick=buy?Math.min(b.o,b.c)-b.l:b.h-Math.max(b.o,b.c);
  const wall=buy?resistance:support, back=buy?support:resistance;
  const edge=buy?lo:hi, prior=span(2,buy?'h':'l',buy?Math.max:Math.min);
  const sweep=span(cfg.reverseLen,buy?'l':'h',buy?Math.min:Math.max);
  if(method==='trend'){
   if(!(d*(fast-slow)>0 && d*(fast-p.fast)>=0 && adx>=Math.max(5,required) &&
     past.some(x=>d*((buy?x.l:x.h)-x.fast)<=a*cfg.near) && d*(b.c-fast)>0 &&
     (buy?rsi>=48:rsi<=52))) continue;
   if(cfg.strict && !(d*(higher.fast-higher.slow)>0 && d*(b.c-prior)>0 && d*(plus-minus)>0)) continue;
  } else if(method==='reverse'){
   const recent=[...history.slice(-4).map(x=>x.rsi),rsi];
   if(!(d*(extreme-sweep)<0 && d*(b.c-sweep)>0 && d*(rsi-p.rsi)>0 &&
     (buy?Math.min(...recent)<cfg.reverseLow:Math.max(...recent)>cfg.reverseHigh) &&
     (!cfg.strict||wick>=body*0.5))) continue;
  } else {
   if(!(adx<=cfg.rangeADX && hi-lo>=1.5*a && d*(extreme-edge)<=a*cfg.edge &&
     d*(b.c-edge)>0 && wick>=body*cfg.wick)) continue;
   if(cfg.strict && !((buy?rsi<48:rsi>52)&&adx<=p.adx)) continue;
   if(cfg.sr&&cfg.rangeSR&&Math.abs(extreme-back)>a*cfg.srNear) continue;
  }
  const base=method==='trend'?span(cfg.swing,buy?'l':'h',buy?Math.min:Math.max):method==='range'?edge:extreme;
  let stop=(buy?Math.min(base,extreme):Math.max(base,extreme))-d*a*cfg.buffer;
  if(d*(b.c-back)>0 && d*(b.c-back)<=a*2.5) stop=buy?Math.min(stop,back-a*cfg.buffer):Math.max(stop,back+a*cfg.buffer);
  const risk=Math.max(d*(b.c-stop),a*0.3);
  const wallDist=d*(wall-b.c);
  if(method==='trend'&&cfg.sr&&cfg.room&&wallDist<risk*cfg.roomR) continue;
  let one=method==='range'?d*(mid-b.c):risk*(method==='trend'?cfg.tp1*(cfg.adaptive&&strong?1.2:1):cfg.adaptive&&strong?0.7:0.8);
  let two=method==='range'?d*((buy?hi:lo)-b.c)-a*cfg.buffer:risk*(method==='trend'?cfg.tp2*(cfg.adaptive&&strong?1.4:1):cfg.adaptive&&strong?1.2:1.5);
  if(method==='reverse'&&d*(fast-b.c)>=risk*cfg.reward) one=Math.min(one,d*(fast-b.c));
  one=Math.min(one,wallDist-a*0.1); two=Math.min(two,wallDist-a*0.1);
  if(risk>tick && risk<=a*cfg.maxRisk && one>=risk*cfg.reward && two>=one)
   candidates.push({method,d,entry:b.c,sl:b.c-d*risk,tp1:b.c+d*one,tp2:b.c+d*two});
 }
 return candidates;
}
function replay(history) {
 let trade=null,last=-Infinity,latest=null;
 for(let i=Math.max(cfg.slow*3,history.length-250);i<history.length;i++){
  const b=history[i];
  if(trade){
   const {d,entry,sl,tp1,tp2,partial,start}=trade;
   const back=d===1?b.l:b.h,front=d===1?b.h:b.l;
   const reaches1=d*(front-tp1)>=0, reaches2=d*(front-tp2)>=0, atBE=d*(back-entry)<=0;
   if(d*(back-(partial?entry:sl))<=0||reaches2||(reaches1&&atBE)||i-start>=cfg.hold) trade=null;
   else if(reaches1) trade.partial=true;
   continue;
  }
  if(i-last<=cfg.cooldown) continue;
  const hit=evaluate(context(history.slice(0,i),b.t),b)[0];
  if(hit){last=i;trade={...hit,start:i,partial:false};if(i===history.length-1)latest=hit;}
 }
 return {blocked:!!trade||history.length-last<=cfg.cooldown,latest};
}
function scenarios(history,bar){
 const ctx=context(history,bar.t), step=Math.max(tick,Math.round(ctx.p.atr*2)/100);
 const start=Math.round(bar.c/tick), stride=Math.round(step/tick), best=new Map();
 const existing=evaluate(ctx,bar)[0];
 if(existing) best.set(existing.method+existing.d,{...existing,now:true,turn:null,score:0,min:bar.c,max:bar.c});
 for(const side of [1,-1]){
  const buy=side===1;
  const edge=ctx.span(cfg.rangeLen,buy?'l':'h',buy?Math.min:Math.max)+side*ctx.p.atr*cfg.edge;
  const sweep=ctx.span(cfg.reverseLen,buy?'l':'h',buy?Math.min:Math.max)-side*tick;
  // Each zone shares one assumed touch price and one contiguous run of closes.
  const turns=[null];
  for(let j=0;j<=6;j++) turns.push(Math.round((edge-side*j*ctx.p.atr/4)/tick)*tick);
  if(cfg.reverse) turns.push(sweep);
  for(const turn of turns){
   let run=null;
   function save(){
    if(!run)return;
    const key=run.method+side, previous=best.get(key);
    if(!previous||run.score<previous.score||(run.score===previous.score&&run.max-run.min>previous.max-previous.min)){
     best.set(key,{...run,now:!!existing&&existing.method===run.method&&existing.d===side&&run.turn===null&&bar.c>=run.min&&bar.c<=run.max});
    }
    run=null;
   }
   for(let i=-150;i<=150;i++){
    const close=(start+i*stride)*tick;
    const b={...bar,c:close,h:Math.max(bar.h,close,turn??-Infinity),l:Math.min(bar.l,close,turn??Infinity)};
    const candidate=evaluate(ctx,b)[0];
    if(!candidate||candidate.d!==side){save();continue;}
    if(run?.method!==candidate.method)save();
    const extra=turn===null?0:buy?Math.max(0,bar.l-turn):Math.max(0,turn-bar.h);
    if(!run)run={...candidate,turn:extra>tick/2?turn:null,min:close,max:close,score:Infinity};
    run.max=close;
    run.score=Math.max(run.min-bar.c,bar.c-run.max,0)+extra;
   }
   save();
  }
 }
 return [...best.values()].sort((a,b)=>a.score-b.score);
}
function render(rows,now) {
 if(!rows.length)throw Error('5分足データがありません');
 const history=measure(rows.filter(b=>b.t+frame<=now));
 const p=history.at(-1);
 if(!p||history.length<Math.max(250,cfg.slow*3+20,cfg.rangeLen+1,cfg.atr+50,cfg.swing+1,cfg.pullback+1,cfg.reverseLen+1,cfg.left+cfg.right+1))
  throw Error('5分足の履歴が不足しています');
 if(now-p.t>frame*2+60000) throw Error('5分足の更新待ち');
 const t=Math.floor(now/frame)*frame, live=rows.find(b=>b.t===t);
 const bar=live??{t,o:p.c,h:p.c,l:p.c,c:p.c};
 const state=replay(history), hits=state.blocked?[]:scenarios(history,bar);
 const stamp=new Date(p.t+frame).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
 $('status').textContent=(live?'取得価格 ':'直近終値 ')+num(bar.c)+' ／ 確定足 '+stamp+' JST';
 const labels={trend:'順張り',reverse:'逆張り',range:'レンジ'};
 $('results').innerHTML=hits.map(x=>{
  const side=x.d===1?'買い':'売り', color=x.d===1?'buy':'sell';
  const distance=bar.c<x.min?x.min-bar.c:bar.c>x.max?x.max-bar.c:0;
  const zone=x.min===x.max?num(x.min):num(x.min)+'〜'+num(x.max);
  const turn=x.turn===null?'':num(x.turn)+' 付近まで'+(x.d===1?'下げて':'上げて')+'から、';
  return '<section><h2 class="'+color+'">'+labels[x.method]+'・'+side+'候補ゾーン</h2><div class="price">'+zone+'</div>'+
    '<small>'+(x.now?'仮条件成立・5分足確定待ち':Math.abs(distance)<0.005?'取得価格はゾーン内':'ゾーンまであと $'+num(Math.abs(distance))+(distance>0?' 上':' 下'))+'</small>'+
    '<p><b>こうなれば</b> '+turn+'5分足が '+zone+(x.min===x.max?' 付近で確定。':' の範囲で確定。')+
    (x.method==='trend'?(cfg.strict?'直近2本の'+(x.d===1?'高値を上抜け':'安値を下抜け')+'、15分EMAとDIの向きも一致。':'EMA・ADX・RSIの順張り条件が一致。'):
     x.method==='range'?'反発ヒゲが実体の'+cfg.wick+'倍以上'+(cfg.strict?'で、ADXが前足以下。':'。'):'直近の高値・安値を抜いた後に反転。')+'</p></section>';
 }).join('')||'<section>'+ (state.latest?'直近5分足で'+labels[state.latest.method]+'・'+(state.latest.d===1?'買い':'売り')+'条件成立 '+num(state.latest.entry):state.blocked?'GTMの保有判定・サイン間隔待ち':'候補なし')+'</section>';
 if(!live) $('status').textContent+=' ／ 進行中の足は取得待ち';
}
let busy=false,timer;
async function update(){
 if(busy||document.hidden||!$('key').value.trim())return;
 busy=true;
 clearTimeout(timer);
 $('refresh').disabled=true;
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);
 try{
  const params=new URLSearchParams({symbol:'XAU/USD',interval:'5min',outputsize:'3000',timezone:'UTC',order:'asc',apikey:$('key').value.trim()});
  const response=await fetch('https://api.twelvedata.com/time_series?'+params,{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw Error('取得エラー HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.values))throw Error('取得できません。APIキー・契約・利用上限を確認してください');
  const now=Date.now();
  const rows=[...new Map(data.values.map(v=>({t:Date.parse(v.datetime.replace(' ','T')+'Z'),o:+v.open,h:+v.high,l:+v.low,c:+v.close}))
   .filter(b=>Object.values(b).every(Number.isFinite)&&b.t<=now&&b.h>=Math.max(b.o,b.c)&&b.l<=Math.min(b.o,b.c)).map(b=>[b.t,b])).values()].sort((a,b)=>a.t-b.t);
  render(rows,now);
 }catch(e){$('results').replaceChildren();$('status').textContent=e.name==='AbortError'?'取得がタイムアウトしました':e.message;}
 finally{
  clearTimeout(timeout);busy=false;$('refresh').disabled=false;
  if(!document.hidden)timer=setTimeout(update,60000);
 }
}
$('form').addEventListener('submit',e=>{
 e.preventDefault();
 cfg=Object.fromEntries(Object.entries(defaults).map(([k,[v]])=>[k,typeof v==='boolean'?$(k).checked:$(k).valueAsNumber]));
 try{localStorage.setItem(settingsName,JSON.stringify(cfg));localStorage.setItem(keyName,$('key').value.trim());}catch{}
 $('settings').open=false;
 update();
});
$('refresh').onclick=update;
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)update();});
update();
</script>
</html>
